<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Luxury | Collection</title>
    <style>
        :root { --bg: #0a0a0a; --card-bg: #141414; --text: #ffffff; --subtext: #a0a0a0; --accent: #ffffff; --border: #262626; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        header { text-align: center; padding: 40px 0 20px; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        header h1 { font-size: 1.8rem; font-weight: 800; }
        .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .image-gallery { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; overflow: hidden; }
        .image-gallery img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .image-gallery img.active { display: block; }
        .details { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .brand { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--subtext); }
        .title { font-size: 1.1rem; font-weight: 700; margin: 4px 0 10px; }
        .price { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; }
        .color-section, .size-section { margin-bottom: 15px; }
        .section-label { font-size: 0.75rem; text-transform: uppercase; color: var(--subtext); margin-bottom: 8px; display: block; }
        .color-options { display: flex; gap: 10px; align-items: center; }
        .color-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
        .color-dot.active { border-color: var(--accent); transform: scale(1.15); }
        .color-nero { background-color: #000; border: 1px solid #444; }
        .color-bianco { background-color: #fff; }
        .color-rosso { background-color: #e74c3c; }
        .color-verde { background-color: #2ecc71; }
        .color-blu { background-color: #3498db; }
        .color-grigio { background-color: #7f8c8d; }
        .color-rosa { background-color: #ff9ff3; }
        .size-options { display: flex; flex-wrap: wrap; gap: 8px; }
        .size-btn { border: 1px solid var(--border); background: #000; color: #fff; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; border-radius: 4px; cursor: pointer; }
        .size-btn.active { background: #fff; color: #000; }
        .btn-buy { width: 100%; padding: 12px; background: #fff; color: #000; border: none; font-weight: 800; text-transform: uppercase; border-radius: 6px; cursor: pointer; margin-top: auto; }
    </style>
</head>
<body>
    <header><h1>Maison Luxury Store</h1></header>
    <div class="catalog" id="catalog"></div>

    <script>
        async function loadCatalog() {
            try {
                const response = await fetch('prodotti.json?v=' + Date.now());
                const products = await response.json();
                const container = document.getElementById('catalog');
                container.innerHTML = '';

                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';

                    // Gestione compatibilità vecchi e nuovi prodotti
                    let imagesObj = {};
                    if (typeof p.images === 'object' && !Array.isArray(p.images) && p.images !== null) {
                        imagesObj = p.images;
                    } else if (Array.isArray(p.images)) {
                        imagesObj = { "Standard": p.images };
                    } else if (p.image) {
                        imagesObj = { "Standard": [p.image] };
                    } else {
                        imagesObj = { "Standard": [] };
                    }

                    const colors = Object.keys(imagesObj);
                    let initialColor = colors[0] || "Standard";

                    let sizesHTML = '';
                    if (p.sizes && p.sizes.length) {
                        sizesHTML = `
                            <div class="size-section">
                                <span class="section-label">Taglia</span>
                                <div class="size-options">
                                    ${p.sizes.map((s, idx) => `<button class="size-btn ${idx === 0 ? 'active' : ''}" onclick="selectSize(this)">${s}</button>`).join('')}
                                </div>
                            </div>`;
                    }

                    let colorsHTML = '';
                    if (colors.length > 0 && colors[0] !== "Standard") {
                        colorsHTML = `
                            <div class="color-section">
                                <span class="section-label">Colore: <strong class="color-name-text">${initialColor}</strong></span>
                                <div class="color-options">
                                    ${colors.map((c, idx) => {
                                        const colorClass = 'color-' + c.toLowerCase().trim();
                                        return `<div class="color-dot ${colorClass} ${idx === 0 ? 'active' : ''}" title="${c}" onclick="switchColor(this, '${c}')"></div>`;
                                    }).join('')}
                                </div>
                            </div>`;
                    }

                    card.innerHTML = `
                        <div class="image-gallery">
                            ${renderGalleryImages(imagesObj[initialColor])}
                        </div>
                        <div class="details">
                            <span class="brand">${p.brand || ''}</span>
                            <h2 class="title">${p.title || ''}</h2>
                            <div class="price">€${p.price ? p.price.toFixed(2) : '0.00'}</div>
                            ${colorsHTML}
                            ${sizesHTML}
                            <button class="btn-buy" onclick="alert('Selezionato!')">Acquista Ora</button>
                        </div>
                    `;

                    card.dataset.images = JSON.stringify(imagesObj);
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Errore caricamento prodotti:", err);
            }
        }

        function renderGalleryImages(arr) {
            if (!arr || arr.length === 0) return `<img src="https://via.placeholder.com/400" class="active">`;
            return arr.map((img, idx) => `<img src="${img}" class="${idx === 0 ? 'active' : ''}">`).join('');
        }

        function switchColor(dotElem, colorName) {
            const card = dotElem.closest('.product-card');
            const imagesData = JSON.parse(card.dataset.images);
            card.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            dotElem.classList.add('active');
            const nameLabel = card.querySelector('.color-name-text');
            if (nameLabel) nameLabel.innerText = colorName;
            const gallery = card.querySelector('.image-gallery');
            gallery.innerHTML = renderGalleryImages(imagesData[colorName]);
        }

        function selectSize(btn) {
            const container = btn.closest('.size-options');
            container.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        document.addEventListener("DOMContentLoaded", loadCatalog);
    </script>
</body>
</html>
