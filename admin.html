<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Maison Luxury</title>
    <style>
        :root { --bg: #0d0d0d; --card: #181818; --accent: #ffffff; --text: #e0e0e0; --danger: #e74c3c; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1, h2 { text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
        .card { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #2a2a2a; }
        label { display: block; margin-top: 15px; font-size: 0.85rem; text-transform: uppercase; color: #a0a0a0; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; background: #000; border: 1px solid #333; border-radius: 4px; color: #fff; box-sizing: border-box; }
        button { background: var(--accent); color: #000; border: none; padding: 14px 20px; font-weight: bold; text-transform: uppercase; width: 100%; border-radius: 4px; margin-top: 20px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: #fff; width: auto; padding: 8px 12px; margin-top: 0; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; }
        .hint { font-size: 0.75rem; color: #777; margin-top: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Pannello Controllo Prodotti</h1>
    
    <div class="card">
        <h2>1. Configurazione Collegamento GitHub</h2>
        <label>Nome Utente GitHub</label>
        <input type="text" id="gh-user" placeholder="es: maison-luxury-official">
        
        <label>Nome Repository</label>
        <input type="text" id="gh-repo" placeholder="es: maison-luxury">
        
        <label>Personal Access Token (GitHub)</label>
        <input type="password" id="gh-token" placeholder="ghp_XXXXXXXXXXXXXXXXXXXX">
        
        <button onclick="saveConfig()">Salva Configurazione</button>
    </div>

    <div class="card">
        <h2>2. Aggiungi / Modifica Prodotto</h2>
        <label>ID Univoco Prodotto (senza spazi)</label>
        <input type="text" id="p-id" placeholder="es: longsleeve-bp">
        
        <label>Titolo Prodotto</label>
        <input type="text" id="p-title" placeholder="es: Longsleeve CH x BAPE">
        
        <label>Marca / Brand</label>
        <input type="text" id="p-brand" placeholder="es: BAPE">
        
        <label>Prezzo (€)</label>
        <input type="number" id="p-price" placeholder="30">
        
        <label>Descrizione</label>
        <textarea id="p-desc" rows="4" placeholder="Descrizione del capo d'abbigliamento..."></textarea>
        
        <label>Taglie Disponibili (separate da virgola)</label>
        <input type="text" id="p-sizes" placeholder="S, M, L, XL">
        
        <label>Colori e Immagini</label>
        <textarea id="p-images" rows="3" placeholder="Nero: foto-nero-1.jpg, foto-nero-2.jpg | Bianco: foto-bianca-1.jpg"></textarea>
        <div class="hint">Formato: <b>Colore1: foto1, foto2 | Colore2: foto3, foto4</b> (oppure metti solo i nomi delle immagini separati da virgola se c'è un solo colore).</div>
        
        <button onclick="saveProduct()">Salva Prodotto su GitHub</button>
    </div>

    <div class="card">
        <h2>3. Prodotti Attualmente Online</h2>
        <button onclick="loadProducts()">Carica / Ricarica Lista</button>
        <div id="product-list" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem('gh_user')) document.getElementById('gh-user').value = localStorage.getItem('gh_user');
        if(localStorage.getItem('gh_repo')) document.getElementById('gh-repo').value = localStorage.getItem('gh_repo');
        if(localStorage.getItem('gh_token')) document.getElementById('gh-token').value = localStorage.getItem('gh_token');
    });

    function saveConfig() {
        localStorage.setItem('gh_user', document.getElementById('gh-user').value.trim());
        localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
        localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
        alert("Configurazione salvata con successo!");
    }

    async function getFileSha(user, repo, token) {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/prodotti.json`, {
            headers: { 'Authorization': `token ${token}` }
        });
        if(res.ok) {
            const data = await res.json();
            return { sha: data.sha, content: JSON.parse(atob(data.content)) };
        }
        return { sha: null, content: [] };
    }

    async function saveProduct() {
        const user = localStorage.getItem('gh_user');
        const repo = localStorage.getItem('gh_repo');
        const token = localStorage.getItem('gh_token');

        if(!user || !repo || !token) return alert("Compila prima la Sezione 1!");

        const id = document.getElementById('p-id').value.trim();
        const title = document.getElementById('p-title').value.trim();
        const brand = document.getElementById('p-brand').value.trim();
        const price = parseFloat(document.getElementById('p-price').value);
        const desc = document.getElementById('p-desc').value.trim();
        const sizes = document.getElementById('p-sizes').value.split(',').map(s => s.trim()).filter(Boolean);
        const rawImages = document.getElementById('p-images').value.trim();

        if(!id || !title) return alert("Inserisci almeno ID e Titolo!");

        let imagesData = {};
        if (rawImages.includes(':')) {
            const parts = rawImages.split('|');
            parts.forEach(part => {
                const [color, imgs] = part.split(':');
                if (color && imgs) {
                    imagesData[color.trim()] = imgs.split(',').map(i => i.trim()).filter(Boolean);
                }
            });
        } else {
            imagesData["Unico"] = rawImages.split(',').map(i => i.trim()).filter(Boolean);
        }

        const newProd = { id, title, brand, price, description: desc, sizes, images: imagesData };

        try {
            const { sha, content } = await getFileSha(user, repo, token);
            let updatedList = content.filter(p => p.id !== id);
            updatedList.push(newProd);

            const updatedContentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(updatedList, null, 2))));
            
            const body = {
                message: `Update product ${id} via Admin Panel`,
                content: updatedContentB64
            };
            if(sha) body.sha = sha;

            const saveRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/prodotti.json`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if(saveRes.ok) {
                alert("Prodotto salvato con successo su GitHub!");
                loadProducts();
            } else {
                alert("Errore durante il salvataggio su GitHub.");
            }
        } catch(e) {
            console.error(e);
            alert("Errore di connessione.");
        }
    }

    async function loadProducts() {
        const user = localStorage.getItem('gh_user');
        const repo = localStorage.getItem('gh_repo');
        const token = localStorage.getItem('gh_token');
        const container = document.getElementById('product-list');

        container.innerHTML = "Caricamento...";
        const { content } = await getFileSha(user, repo, token);
        
        container.innerHTML = "";
        if(content.length === 0) container.innerHTML = "Nessun prodotto trovato.";

        content.forEach(p => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <div>
                    <strong>${p.title}</strong> (${p.id})<br>
                    <small>${p.brand} - €${p.price}</small>
                </div>
                <button class="btn-danger" onclick="deleteProduct('${p.id}')">Elimina</button>
            `;
            container.appendChild(row);
        });
    }

    async function deleteProduct(id) {
        if(!confirm(`Sei sicuro di voler eliminare il prodotto ${id}?`)) return;
        const user = localStorage.getItem('gh_user');
        const repo = localStorage.getItem('gh_repo');
        const token = localStorage.getItem('gh_token');

        const { sha, content } = await getFileSha(user, repo, token);
        const updatedList = content.filter(p => p.id !== id);
        const updatedContentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(updatedList, null, 2))));

        const saveRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/prodotti.json`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: `Delete product ${id} via Admin Panel`,
                content: updatedContentB64,
                sha: sha
            })
        });

        if(saveRes.ok) {
            alert("Prodotto eliminato!");
            loadProducts();
        }
    }
</script>
</body>
</html>
