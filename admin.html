<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Admin | Maison Luxury</title>
  <style>
    :root {
      --bg: #09090d;
      --card-bg: #13131a;
      --accent: #ffffff;
      --border: #22222e;
      --text: #ffffff;
      --text-muted: #a0a0b0;
      --danger: #ff4d4d;
      --success: #2ec4b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1000px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
    h1 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }

    .config-card, .form-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 25px; }
    .card-title { font-size: 1.1rem; margin-bottom: 15px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.5px; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%; padding: 12px; background: #000000; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.95rem; outline: none;
    }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .btn { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); color: #fff; }

    .product-list { display: grid; gap: 15px; }
    .product-item { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .product-info { display: flex; align-items: center; gap: 15px; }
    .product-info img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; background: #000; }

    .status-msg { margin-top: 10px; font-size: 0.85rem; font-weight: bold; }
    .status-success { color: var(--success); }
    .status-error { color: var(--danger); }
  </style>
</head>
<body>

  <header>
    <h1>Pannello Controllo Prodotti</h1>
    <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;">$\leftarrow$ Torna al Sito</a>
  </header>

  <!-- CONFIGURAZIONE CHIAVE GITHUB -->
  <div class="config-card">
    <div class="card-title">1. Configurazione Collegamento GitHub</div>
    <div class="form-grid-2">
      <div class="form-group">
        <label>Nome Utente GitHub</label>
        <input type="text" id="gh-user" placeholder="Es: TuoNomeUtente">
      </div>
      <div class="form-group">
        <label>Nome Repository</label>
        <input type="text" id="gh-repo" placeholder="Es: il-tuo-sito">
      </div>
    </div>
    <div class="form-group">
      <label>Personal Access Token (GitHub)</label>
      <input type="text" id="gh-token" placeholder="ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX">
    </div>
    <button class="btn" onclick="saveConfig()">Salva Configurazione</button>
    <div id="config-status" class="status-msg"></div>
  </div>

  <!-- MODULO NUOVO PRODOTTO -->
  <div class="form-card">
    <div class="card-title">2. Aggiungi / Modifica Prodotto</div>
    <form id="productForm" onsubmit="handleProductSubmit(event)">
      <div class="form-grid-2">
        <div class="form-group">
          <label>ID Univoco Prodotto (senza spazi)</label>
          <input type="text" id="p-id" required placeholder="es: felpa-ch-nero">
        </div>
        <div class="form-group">
          <label>Titolo Prodotto</label>
          <input type="text" id="p-title" required placeholder="es: Felpa CH Classic">
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label>Marca / Brand</label>
          <input type="text" id="p-brand" required placeholder="es: CH">
        </div>
        <div class="form-group">
          <label>Prezzo (€)</label>
          <input type="number" id="p-price" step="0.01" required placeholder="30.00">
        </div>
      </div>

      <div class="form-group">
        <label>Descrizione</label>
        <textarea id="p-desc" rows="3" placeholder="Descrizione del capo d'abbigliamento..."></textarea>
      </div>

      <div class="form-group">
        <label>Taglie Disponibili (separate da virgola)</label>
        <input type="text" id="p-sizes" placeholder="S, M, L, XL">
      </div>

      <div class="form-group">
        <label>Nome File Immagine Principale</label>
        <input type="text" id="p-img" required placeholder="IMG_5875.jpeg">
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Salva Prodotto su GitHub</button>
    </form>
    <div id="save-status" class="status-msg"></div>
  </div>

  <!-- LISTA PRODOTTI ATTUALI -->
  <div class="form-card">
    <div class="card-title">3. Prodotti Attualmente Online</div>
    <button class="btn" style="margin-bottom: 15px;" onclick="loadProductsFromGitHub()">Carica/Ricarica Lista</button>
    <div class="product-list" id="products-list">
      <p style="color: var(--text-muted);">Inserisci la configurazione sopra e clicca su Carica per vedere i prodotti.</p>
    </div>
  </div>

  <script>
    let products = [];
    let fileSha = '';

    // Carica configurazione salvata nel browser
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('gh-user').value = localStorage.getItem('gh_user') || '';
      document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
      document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
    });

    function saveConfig() {
      localStorage.setItem('gh_user', document.getElementById('gh-user').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
      
      const status = document.getElementById('config-status');
      status.innerText = "Configurazione salvata nel browser!";
      status.className = "status-msg status-success";
      
      loadProductsFromGitHub();
    }

    async function loadProductsFromGitHub() {
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const token = localStorage.getItem('gh_token');

      if(!user || !repo || !token) {
        alert("Compila prima tutti i dati di configurazione al punto 1!");
        return;
      }

      const listDiv = document.getElementById('products-list');
      listDiv.innerHTML = '<p style="color: var(--text-muted);">Caricamento in corso...</p>';

      try {
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/prodotti.json`, {
          headers: { 'Authorization': `token ${token}` }
        });

        if(!response.ok) throw new Error("Impossibile trovare prodotti.json o Token non valido.");

        const data = await response.json();
        fileSha = data.sha; 
        
        // Decodifica Base64 del file JSON
        const decodedContent = decodeURIComponent(escape(atob(data.content)));
        products = JSON.parse(decodedContent);

        renderAdminList();
      } catch (err) {
        listDiv.innerHTML = `<p class="status-msg status-error">Errore: ${err.message}</p>`;
      }
    }

    function renderAdminList() {
      const listDiv = document.getElementById('products-list');
      if(products.length === 0) {
        listDiv.innerHTML = '<p style="color: var(--text-muted);">Nessun prodotto nel file JSON.</p>';
        return;
      }

      listDiv.innerHTML = products.map((p, idx) => `
        <div class="product-item">
          <div class="product-info">
            <img src="${p.variants && p.variants[0] ? p.variants[0].img : ''}" alt="">
            <div>
              <strong style="display:block;">${p.title}</strong>
              <small style="color: var(--text-muted);">${p.brand} - ${p.price.toFixed(2)}€</small>
            </div>
          </div>
          <button class="btn btn-danger" onclick="deleteProduct(${idx})">Elimina</button>
        </div>
      `).join('');
    }

    async function handleProductSubmit(e) {
      e.preventDefault();
      
      const newProd = {
        id: document.getElementById('p-id').value.trim(),
        title: document.getElementById('p-title').value.trim(),
        brand: document.getElementById('p-brand').value.trim(),
        price: parseFloat(document.getElementById('p-price').value),
        desc: document.getElementById('p-desc').value.trim(),
        sizes: document.getElementById('p-sizes').value.split(',').map(s => s.trim()).filter(s => s !== ''),
        variants: [
          { color: "Unico", img: document.getElementById('p-img').value.trim() }
        ]
      };

      products.push(newProd);
      await saveProductsToGitHub("Aggiunto nuovo prodotto: " + newProd.title);
      document.getElementById('productForm').reset();
    }

    async function deleteProduct(index) {
      if(!confirm("Sei sicuro di voler eliminare questo prodotto?")) return;
      const removed = products.splice(index, 1);
      await saveProductsToGitHub("Eliminato prodotto: " + removed[0].title);
    }

    async function saveProductsToGitHub(commitMessage) {
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const token = localStorage.getItem('gh_token');
      const status = document.getElementById('save-status');

      status.innerText = "Salvataggio su GitHub in corso...";
      status.className = "status-msg";

      const updatedContentJson = JSON.stringify(products, null, 2);
      const encodedContent = btoa(unescape(encodeURIComponent(updatedContentJson)));

      try {
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/prodotti.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: commitMessage,
            content: encodedContent,
            sha: fileSha
          })
        });

        if(!response.ok) throw new Error("Errore durante il salvataggio.");

        const resData = await response.json();
        fileSha = resData.content.sha;

        status.innerText = "Prodotti aggiornati con successo su GitHub!";
        status.className = "status-msg status-success";
        renderAdminList();
      } catch (err) {
        status.innerText = "Errore durante il salvataggio: " + err.message;
        status.className = "status-msg status-error";
      }
    }
  </script>
</body>
</html>
